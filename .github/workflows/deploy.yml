name: Build & Deploy (Railway)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      reset_db: ${{ steps.check_migrations.outputs.reset_db }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Detect migration changes
        id: check_migrations
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "GameService/Infrastructure/Migrations"; then
            echo "reset_db=true" >> $GITHUB_OUTPUT
          else
            echo "reset_db=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore GameService/API/API.csproj

      - name: Build
        run: dotnet build GameService/API/API.csproj --configuration Release --no-restore

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t longdong123/shroomfall-gamems:latest \
            -f GameService/Dockerfile .

      - name: Push Docker image
        run: docker push longdong123/shroomfall-gamems:latest


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # 1. Reset Database (Using SQL instead of tearing down the Railway service)
      # Note: Adjust the command below based on your specific DB engine (Postgres used as example)
      - name: Reset Database Schema
        if: ${{ needs.build.outputs.reset_db == 'true' }}
        run: psql $DATABASE_URL -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}

        # 2. Tell Railway to rebuild and redeploy the current service
      - name: Redeploy Game Service
        run: railway redeploy --service gamems-api --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

