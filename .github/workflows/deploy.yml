name: Build & Deploy (Railway)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      reset_db: ${{ steps.check_migrations.outputs.reset_db }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Detect migration changes
        id: check_migrations
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "GameService/Infrastructure/Migrations"; then
            echo "reset_db=true" >> $GITHUB_OUTPUT
          else
            echo "reset_db=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore GameService/API/API.csproj

      - name: Build
        run: dotnet build GameService/API/API.csproj --configuration Release --no-restore

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t longdong123/shroomfall-gamems:latest \
            -f GameService/Dockerfile .

      - name: Push Docker image
        run: docker push longdong123/shroomfall-gamems:latest


  deploy:
      needs: build
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Install Railway CLI
          run: npm install -g @railway/cli

        # 1. Nuke the old SQL database container if migrations changed
        - name: Delete Old SQL Server
          if: ${{ needs.build.outputs.reset_db == 'true' }}
          run: railway service:delete --service server.railway.internal --agree
          env:
            RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

        # 2. Instantly spin up a fresh SQL Server instance (Fixed CLI creation flags)
        - name: Recreate Fresh SQL Server
          if: ${{ needs.build.outputs.reset_db == 'true' }}
          run: railway service:create --name "server.railway.internal"
          env:
            RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

        # 3. Deploy your updated backend (Explicitly pointing to your Dockerfile to bypass Railpack)
        - name: Deploy Game Service
          run: railway up --service gamems-api.railway.internal --dockerfile GameService/Dockerfile
          env:
            RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}