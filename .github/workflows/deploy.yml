name: Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      reset_db: ${{ steps.check_migrations.outputs.reset_db }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Check migration changes
        id: check_migrations
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "GameService/Infrastructure/Migrations"; then
            echo "reset_db=true" >> $GITHUB_OUTPUT
          else
            echo "reset_db=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore GameService/API/API.csproj

      - name: Build
        run: dotnet build GameService/API/API.csproj --configuration Release --no-restore

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t longdong123/shroomfall-gamems:latest -f GameService/Dockerfile .

      - name: Push Docker image
        run: docker push longdong123/shroomfall-gamems:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /root

            echo "Pulling latest image..."
            docker pull longdong123/shroomfall-gamems:latest

            if [ "${{ needs.build.outputs.reset_db }}" = "true" ]; then
              echo "Migration changed. Wiping databases..."
              docker compose down -v
            else
              echo "No migration changes."
              docker compose down
            fi

            docker compose up -d --remove-orphans

            echo "Deployment completed"